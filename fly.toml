# Deploy with Fly.io (free to try):
#   fly launch --no-deploy --copy-config      (pick a unique app name when asked)
#   fly volumes create data --size 1 --region bom
#   fly secrets set LASTFM_API_KEY=... LASTFM_SHARED_SECRET=... BASE_URL=https://<your-app>.fly.dev ADMIN_USERNAMES=<your-lastfm-username>
#   fly deploy
# Remember to set the Last.fm callback URL to https://<your-app>.fly.dev/auth/lastfm/callback
app = "music-connect"
primary_region = "bom"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/app.db"
  NODE_ENV = "production"
  DEV_LOGIN = "false"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"   # keep the single instance up (chat presence lives in memory)
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
